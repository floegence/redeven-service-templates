name: Update reviewed releases

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: service-template-release-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Create isolated update worktree
        id: worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          base="$(git rev-parse origin/main)"
          git merge --ff-only "$base"
          worktree="$(mktemp -d "${RUNNER_TEMP}/service-template-release.XXXXXX")"
          branch="codex/automation/catalog-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add -b "$branch" "$worktree" "$base"
          {
            echo "path=$worktree"
            echo "base=$base"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Discover, generate, preflight and test staged releases
        working-directory: ${{ steps.worktree.outputs.path }}
        run: go run ./cmd/release-watcher

      - name: Verify public contracts and Desktop acquisition
        working-directory: ${{ steps.worktree.outputs.path }}
        run: |
          go run ./cmd/generate-contracts --verify
          node --test sdk/*.test.cjs

      - name: Commit the verified candidate
        id: commit
        working-directory: ${{ steps.worktree.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.go internal/cataloggen/generate.go templates dist
          git commit -m 'fix(catalog): refresh deepseek harness releases'
          test -z "$(git status --porcelain)"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Fast-forward main and publish the immutable tag atomically
        if: steps.commit.outputs.changed == 'true'
        env:
          BASE: ${{ steps.worktree.outputs.base }}
          BRANCH: ${{ steps.worktree.outputs.branch }}
        run: bash scripts/publish_catalog.sh "$BASE" "$BRANCH"

      - name: Report no-op
        if: steps.commit.outputs.changed == 'false'
        run: echo 'No source release changed; main and tags are unchanged.'

      - name: Report failure
        if: failure()
        run: |
          echo '::error title=Release watcher failed::Catalog publication did not complete. Inspect the immutable remote refs before retrying an uncertain network result.'
          echo 'Release discovery, validation, or atomic publication failed. Existing release tags are never moved or overwritten.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove this run's temporary worktree and private branch
        if: always() && steps.worktree.outputs.path != ''
        env:
          WORKTREE: ${{ steps.worktree.outputs.path }}
          BRANCH: ${{ steps.worktree.outputs.branch }}
        run: |
          git worktree remove --force "$WORKTREE"
          git branch -D "$BRANCH"
